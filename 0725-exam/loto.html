<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ball {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            margin: 4px;
        }       
        .ball_1 {background-color: rgb(252, 201, 108);}
        .ball_11 {background-color: rgb(96, 96, 255);}
        .ball_21 {background-color: red;}
        .ball_31 {background-color: black;}
        .ball_41 {background-color: rgb(57, 245, 57);}
    </style>
</head>
<body>
    <h1>대박을 꿈꾸다.....</h1>
    <div id="result"></div>
    <button id="btn">클릭</button>

    <script>
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');

    function getBallClass(num) {
            if (num <= 10) return 'ball_1';
            if (num <= 20) return 'ball_11';
            if (num <= 30) return 'ball_21';
            if (num <= 40) return 'ball_31';
            return 'ball_41';
        }

    // 클릭할 때마다 작동할 행동을 이 중괄호 { } 안에 집어넣습니다.
    btn.addEventListener('click', () => {
        const numbers = []; // 클릭할 때마다 리셋된 새 배열 생성
        
        for (let i = 0; i < 6; i++) {
            const num = Math.floor(Math.random() * 45) + 1;
            let isDuplicate = false;
        
        for(let j = 0; j < numbers.length; j++) {
            if (numbers[j] === num) {
                isDuplicate = true; // 중복발견
                break;
            }
        }
        if (!isDuplicate) {
            numbers.push(num);
        } else {
            i--;
        }
    }
        numbers.sort((a,b) => a-b);

        let bonusNum;
        while (true) {
            bonusNum = Math.floor(Math.random() * 45) + 1;
            if (!numbers.includes(bonusNum)){
                break;
            }
        }

        const mainBalls = numbers
        .map(num => `<span class="ball ${getBallClass(num)}">${num}</span>`)
        .join('');

        const bonusBall = `<span class="plus">+</span><span class="ball ${getBallClass(bonusNum)}">${bonusNum}</span>`;

        result.innerHTML = mainBalls + bonusBall


    });

    </script>
</body>
</html>
